name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - run: wails3 task darwin:package:universal
      - run: wails3 task darwin:create:dmg
      - run: lipo -archs bin/tonelab.app/Contents/MacOS/tonelab | grep -q "x86_64 arm64"
      - run: mv bin/tonelab.dmg bin/tonelab-${{ github.ref_name }}-macos-universal.dmg
      - name: Command line, universal
        run: |
          GOARCH=amd64 go build -trimpath -ldflags="-w -s" -o bin/cli-amd64 ./cmd/tonelab-cli
          GOARCH=arm64 go build -trimpath -ldflags="-w -s" -o bin/cli-arm64 ./cmd/tonelab-cli
          lipo -create -output bin/tonelab-cli-${{ github.ref_name }}-macos-universal bin/cli-amd64 bin/cli-arm64
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ startsWith(github.ref_name, 'v0.0.') }}
          files: |
            bin/tonelab-*.dmg
            bin/tonelab-cli-*-macos-universal

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev
      - run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - run: wails3 generate bindings -ts -d frontend/bindings
      - run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: Cross-compile
        run: |
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -tags production -trimpath -ldflags="-w -s -H windowsgui" -o bin/tonelab-${{ github.ref_name }}-windows-$arch.exe .
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-w -s" -o bin/tonelab-cli-${{ github.ref_name }}-windows-$arch.exe ./cmd/tonelab-cli
          done
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ startsWith(github.ref_name, 'v0.0.') }}
          files: bin/tonelab-*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev
      - run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - run: wails3 generate bindings -ts -d frontend/bindings
      - run: npm --prefix frontend ci && npm --prefix frontend run build
      - run: go build -tags "production gtk3" -trimpath -ldflags="-w -s" -o bin/tonelab-${{ github.ref_name }}-linux-amd64 .
      - run: go build -trimpath -ldflags="-w -s" -o bin/tonelab-cli-${{ github.ref_name }}-linux-amd64 ./cmd/tonelab-cli
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ startsWith(github.ref_name, 'v0.0.') }}
          files: |
            bin/tonelab-*-linux-amd64
            bin/tonelab-cli-*-linux-amd64
