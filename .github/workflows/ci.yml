name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The root package links the desktop runtime, which needs GTK on Linux;
      # the backend packages are what the tests cover. The MIDI port needs
      # ALSA headers there. Its loop test skips on this runner, whose kernel
      # has no snd-seq module, and says so in the log.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: go vet ./backend/...
      - run: go test -race ./backend/...

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev
      # The CLI links the desktop runtime, which on Linux defaults to GTK4;
      # the gtk3 tag makes it use the headers installed above.
      - name: Install the Wails CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
          else
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
          fi
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            wails3 generate bindings -ts -d frontend/bindings
            npm --prefix frontend ci && npm --prefix frontend run build
            go build -tags "production gtk3" -trimpath -ldflags="-w -s" -o bin/tonelab .
          else
            wails3 build
          fi
