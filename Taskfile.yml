version: '3'

vars:
  APP_NAME: "tonelab"
  # What the binary reports as its version and compares against the
  # latest release: the tag when on one, the commit otherwise.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  test:
    summary: Runs the Go test suite (no DAW required)
    cmds:
      - go test ./...

  test:reaper:
    summary: Runs the round-trip tests against a real running REAPER
    cmds:
      # -p 1 because every round-trip test binds REAPER's one feedback port,
      # so the packages cannot run in parallel the way the normal suite does.
      - go test -tags reaper -count=1 -p 1 ./...

  test:ableton:
    summary: Runs the round-trip tests against a running Ableton Live with AbletonOSC
    cmds:
      - go test -tags ableton -count=1 ./internal/daw

  ci:
    summary: Everything the hosted CI used to run, on this machine. Vet and the race suite, the frontend typecheck, a macOS package, a Windows cross-build and the Linux build in Docker. Green here is the bar for merging into main.
    cmds:
      - gofmt -l . | tee /dev/stderr | test -z "$(cat)"
      - go vet ./...
      - go test -race -count=1 ./internal/... ./cmd/...
      - GOOS=windows CGO_ENABLED=0 go vet ./internal/... ./cmd/...
      - GOOS=linux CGO_ENABLED=0 go vet ./internal/... ./cmd/...
      - npm --prefix frontend run ci
      - task: common:build:frontend
      - task: darwin:package
      - task: build:windows
      - task: build:linux
      - task: build:cli

  build:cli:
    summary: Builds the command line and the standalone MCP server for this machine, Windows and Linux. The Linux ones need ALSA headers, so they are built in Docker like the app.
    cmds:
      - for: ["tonelab-cli", "tonelab-mcp"]
        cmd: go build -trimpath -ldflags="-w -s -X github.com/winterstim/tonelab/internal/version.Version={{.VERSION}}" -o {{.BIN_DIR}}/{{.ITEM}} ./cmd/{{.ITEM}}
      - for: ["amd64", "arm64"]
        cmd: >-
          for command in tonelab-cli tonelab-mcp; do
          GOOS=windows GOARCH={{.ITEM}} CGO_ENABLED=0 go build -trimpath -ldflags="-w -s -X github.com/winterstim/tonelab/internal/version.Version={{.VERSION}}" -o {{.BIN_DIR}}/$command-windows-{{.ITEM}}.exe ./cmd/$command || exit 1;
          done
      - for: ["amd64", "arm64"]
        cmd: >-
          docker run --rm --platform linux/{{.ITEM}} -v "$PWD":/src -w /src -e GOFLAGS=-buildvcs=false -e HOME=/tmp golang:1.26-bookworm bash -c
          'apt-get update -qq >/dev/null && apt-get install -y -qq libasound2-dev >/dev/null 2>&1
          && for command in tonelab-cli tonelab-mcp; do GOMODCACHE=/tmp/gomod GOCACHE=/tmp/gocache go build -trimpath -ldflags="-w -s -X github.com/winterstim/tonelab/internal/version.Version={{.VERSION}}"
          -o {{.BIN_DIR}}/$command-linux-{{.ITEM}} ./cmd/$command || exit 1; done'

  build:windows:
    summary: Cross-compiles the Windows binaries from any host (no cgo on Windows)
    deps: [common:build:frontend]
    cmds:
      - GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags production -trimpath -ldflags="-w -s -H windowsgui -X github.com/winterstim/tonelab/internal/version.Version={{.VERSION}}" -o {{.BIN_DIR}}/{{.APP_NAME}}-windows-amd64.exe .
      - GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -tags production -trimpath -ldflags="-w -s -H windowsgui -X github.com/winterstim/tonelab/internal/version.Version={{.VERSION}}" -o {{.BIN_DIR}}/{{.APP_NAME}}-windows-arm64.exe .

  build:linux:
    summary: Builds the Linux binaries in Docker, since they need GTK and WebKitGTK headers
    deps: [common:build:frontend]
    cmds:
      - for: ["amd64", "arm64"]
        cmd: >-
          docker run --rm --platform linux/{{.ITEM}} -v "$PWD":/src -w /src -e GOFLAGS=-buildvcs=false -e HOME=/tmp golang:1.26-bookworm bash -c
          'apt-get update -qq >/dev/null && apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev >/dev/null 2>&1
          && GOMODCACHE=/tmp/gomod GOCACHE=/tmp/gocache go build -tags "production gtk3" -trimpath -ldflags="-w -s -X github.com/winterstim/tonelab/internal/version.Version={{.VERSION}}"
          -o {{.BIN_DIR}}/{{.APP_NAME}}-linux-{{.ITEM}} .'

  release:
    summary: Builds every artefact for a release, named the way the site's download page and the service expect (tonelab[-cli|-mcp]-<tag>-<os>-<arch>[.dmg|.exe|.mcpb]), into bin/release. Tag first, so VERSION is the tag.
    cmds:
      - rm -rf {{.BIN_DIR}}/release && mkdir -p {{.BIN_DIR}}/release
      - task: darwin:package:universal
      - task: darwin:create:dmg
      - mv {{.BIN_DIR}}/{{.APP_NAME}}.dmg {{.BIN_DIR}}/release/{{.APP_NAME}}-{{.VERSION}}-macos-universal.dmg
      - task: build:windows
      - task: build:linux
      - task: build:cli
      - for: ["cli", "mcp"]
        cmd: >-
          for arch in amd64 arm64; do
          GOARCH=$arch go build -trimpath -ldflags="-w -s -X github.com/winterstim/tonelab/internal/version.Version={{.VERSION}}" -o {{.BIN_DIR}}/{{.ITEM}}-$arch ./cmd/tonelab-{{.ITEM}} || exit 1;
          done
          && lipo -create -output {{.BIN_DIR}}/release/{{.APP_NAME}}-{{.ITEM}}-{{.VERSION}}-macos-universal {{.BIN_DIR}}/{{.ITEM}}-amd64 {{.BIN_DIR}}/{{.ITEM}}-arm64
          && rm {{.BIN_DIR}}/{{.ITEM}}-amd64 {{.BIN_DIR}}/{{.ITEM}}-arm64
      - for: ["amd64", "arm64"]
        cmd: cp {{.BIN_DIR}}/{{.APP_NAME}}-windows-{{.ITEM}}.exe {{.BIN_DIR}}/release/{{.APP_NAME}}-{{.VERSION}}-windows-{{.ITEM}}.exe && cp {{.BIN_DIR}}/{{.APP_NAME}}-linux-{{.ITEM}} {{.BIN_DIR}}/release/{{.APP_NAME}}-{{.VERSION}}-linux-{{.ITEM}} && cp {{.BIN_DIR}}/{{.APP_NAME}}-cli-windows-{{.ITEM}}.exe {{.BIN_DIR}}/release/{{.APP_NAME}}-cli-{{.VERSION}}-windows-{{.ITEM}}.exe && cp {{.BIN_DIR}}/{{.APP_NAME}}-cli-linux-{{.ITEM}} {{.BIN_DIR}}/release/{{.APP_NAME}}-cli-{{.VERSION}}-linux-{{.ITEM}}
      - for: ["amd64", "arm64"]
        cmd: cp {{.BIN_DIR}}/{{.APP_NAME}}-mcp-windows-{{.ITEM}}.exe {{.BIN_DIR}}/release/{{.APP_NAME}}-mcp-{{.VERSION}}-windows-{{.ITEM}}.exe && cp {{.BIN_DIR}}/{{.APP_NAME}}-mcp-linux-{{.ITEM}} {{.BIN_DIR}}/release/{{.APP_NAME}}-mcp-{{.VERSION}}-linux-{{.ITEM}}
      # Claude Desktop installs a bundle with a double click; it runs on
      # macOS and Windows only, so those are the bundles made.
      - build/mcpb/pack.sh {{.VERSION}} darwin {{.BIN_DIR}}/release/{{.APP_NAME}}-mcp-{{.VERSION}}-macos-universal {{.BIN_DIR}}/release/{{.APP_NAME}}-mcp-{{.VERSION}}-macos-universal.mcpb
      - for: ["amd64", "arm64"]
        cmd: build/mcpb/pack.sh {{.VERSION}} win32 {{.BIN_DIR}}/{{.APP_NAME}}-mcp-windows-{{.ITEM}}.exe {{.BIN_DIR}}/release/{{.APP_NAME}}-mcp-{{.VERSION}}-windows-{{.ITEM}}.mcpb
      - ls -la {{.BIN_DIR}}/release
