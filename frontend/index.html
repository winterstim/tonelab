<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <link rel="stylesheet" href="/style.css"/>
    <title>Tonelab</title>
</head>
<body>
<main class="app">
    <header class="app-header">
        <h1 class="app-title">Tonelab</h1>
        <!-- Connection is inferred from DAW feedback, so this reflects what the
             backend has actually heard rather than whether we sent anything. -->
        <div class="daw-status" id="daw-status" data-connected="false">
            <span class="daw-dot" aria-hidden="true"></span>
            <span id="daw-status-text">Checking the DAW…</span>
        </div>
    </header>

    <!-- One field and one visible effect,. No message
         history: MVP carries nothing between commands. -->
    <form class="command" id="command-form">
        <input
            id="command-input"
            class="command-input"
            type="text"
            autocomplete="off"
            placeholder="Turn track 2 down a little"
            aria-label="Command"/>
        <button class="command-send" id="command-send" type="submit">Send</button>
    </form>

    <output class="answer" id="answer" role="status" aria-live="polite"></output>

    <!-- Kept because they reach the DAW without the language model, which makes
         them the fastest way to tell a DAW problem from a model problem. -->
    <footer class="transport">
        <!-- Beside the agent rather than behind it: after a command goes
             wrong, asking the model to fix it means trusting what just
             erred. -->
        <button class="transport-btn transport-undo" id="undo" type="button">Undo last change</button>
        <span class="transport-label">Transport</span>
        <button class="transport-btn" id="transport-play" type="button">Play</button>
        <button class="transport-btn" id="transport-stop" type="button">Stop</button>
    </footer>
</main>
<script src="/src/main.ts" type="module"></script>
</body>
</html>
